<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header">
        <h1 id="title">Gallery</h1>
        <nav class="nav">
            <a href="../index.html">Main</a> |
            <a href="contacts.html">Contacts</a> |
            <a href="gallery.html">Gallery</a>
        </nav>
    </header>
    <main id="main-content">
        <h2 id="gallery-title">Part of my life</h2>
        <table class="gallery-table">
            <tr>
                <td>
                    <figure class="gallery-figure">
                        <img src="../photo/busya.jpg" width="250" height="250" alt="My cat Busya" class="gallery-img">
                        <figcaption>My cat Busya</figcaption>
                    </figure>
                </td>
                <td>
                    <figure class="gallery-figure">
                        <img src="../photo/osu.png" width="250" height="250" alt="My favourite rhythm game" class="gallery-img">
                        <figcaption>My favourite rhythm game</figcaption>
                    </figure>
                </td>
                <td>
                    <figure class="gallery-figure">
                        <img src="../photo/verka.jpg" width="250" height="250" alt="Last concert I went to" class="gallery-img">
                        <figcaption>Last concert I went to</figcaption>
                    </figure>
                </td>
                <td>
                    <figure class="gallery-figure">
                        <img src="../photo/patrick.jpg" width="250" height="250" alt="My favourite catroon character" class="gallery-img">
                        <figcaption>My favourite catroon character</figcaption>
                    </figure>
                </td>
                <td>
                    <figure class="gallery-figure">
                        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                            <img src="../photo/rick.jpg" width="250" height="250" alt="My favourite meme" class="gallery-img">
                        </a>
                        <figcaption>
                            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">My favourite meme</a>
                        </figcaption>
                    </figure>
                </td>
            </tr>
        </table>    
    </main>
</body>
</html>
